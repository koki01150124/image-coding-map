<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Image Coding Map</title>
  <meta name="description" content="従来型・学習型・生成型の画像圧縮，情報源・通信路分離符号化，アナログ型・デジタル型 DeepJSCC，通信路符号の研究系譜を可視化したマップ">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div class="app">
    <header class="toolbar" role="toolbar" aria-label="表示の操作">
      <h1 class="title">Image Coding Map</h1>
      <div class="search">
        <label class="visually-hidden" for="search-input">論文・手法を検索</label>
        <input id="search-input" type="search" list="search-list" placeholder="論文・手法・著者・タグで検索（例: NECST）" autocomplete="off">
        <datalist id="search-list"></datalist>
        <span id="search-count" class="search-count" aria-live="polite"></span>
      </div>
      <div class="toolbar-buttons">
        <button type="button" id="btn-fit" title="全体を表示">全体表示</button>
        <button type="button" id="btn-list" aria-pressed="false" title="表示中の論文を一覧表で表示">一覧表</button>
        <button type="button" id="btn-patterns" aria-pressed="false" title="改良パターン・採用技術 × 研究分野の対応表">パターン表</button>
        <button type="button" id="btn-compare" aria-pressed="false" title="選んだ論文（最大3件）の比較と系譜の経路">比較（0）</button>
        <details class="menu" id="export-menu">
          <summary title="マップを画像として保存">書き出し</summary>
          <div class="menu-body">
            <button type="button" id="btn-svg">SVG で保存</button>
            <button type="button" id="btn-png">PNG で保存</button>
          </div>
        </details>
        <button type="button" id="btn-theme" title="配色の切り替え（自動 → ライト → ダーク）">配色: 自動</button>
      </div>
    </header>

    <nav class="legend" aria-label="分野・エッジ・年の絞り込み">
      <div class="legend-group">
        <span class="legend-title">分野</span>
        <ul id="domain-legend" class="chips"></ul>
      </div>
      <div class="legend-group">
        <span class="legend-title">関係</span>
        <ul id="edge-legend" class="chips"></ul>
      </div>
      <div class="legend-group">
        <label class="legend-title" for="period-select">期間</label>
        <select id="period-select" title="指定した年以降の論文に注目する"></select>
      </div>
      <div class="legend-group year-control">
        <label class="legend-title" for="year-slider">年</label>
        <input id="year-slider" type="range" aria-describedby="year-out">
        <output id="year-out" for="year-slider">全期間</output>
        <button type="button" id="btn-play" title="年を進めながら表示する">▶ 再生</button>
      </div>
      <div id="focus-note" class="focus-note" aria-live="polite" hidden></div>
    </nav>

    <main class="stage">
      <div id="graph" class="graph" aria-label="研究系譜マップ"></div>
      <div id="list-view" class="overlay-view" hidden></div>
      <div id="pattern-view" class="overlay-view" hidden></div>
      <div id="compare-view" class="overlay-view" hidden></div>
      <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
      <div class="shape-legend" aria-label="ノードの形">
        <span><svg width="14" height="14" aria-hidden="true"><circle cx="7" cy="7" r="5" class="sl-paper"/></svg>論文</span>
        <span><svg width="14" height="14" aria-hidden="true"><rect x="2" y="2" width="10" height="10" rx="2" class="sl-paper"/></svg>標準・ソフトウェア</span>
        <span><svg width="14" height="14" aria-hidden="true"><circle cx="7" cy="7" r="5" class="sl-scheme"/></svg>構成例</span>
        <span><svg width="14" height="14" aria-hidden="true"><circle cx="7" cy="7" r="5" class="sl-unpub"/></svg>未公開</span>
        <span>外周の色分け＝複数分野</span>
      </div>
    </main>

    <aside id="panel" class="panel" aria-live="polite" hidden>
      <button type="button" id="panel-close" class="panel-close" aria-label="詳細を閉じる">×</button>
      <div id="panel-body"></div>
    </aside>

    <p id="status" class="status" role="status">読み込み中…</p>
  </div>

  <script src="vendor/d3.v7.9.0.min.js"></script>
  <script type="module" src="assets/app.js"></script>
</body>
</html>
